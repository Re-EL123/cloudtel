# CloudTel telephony vhost. Placeholders are rendered by deploy.sh.
# Include from the http{} block of nginx.conf:
#   include /etc/nginx/cloudtel/*.conf;

server {
    listen 80;
    listen [::]:80;
    server_name __SIP_HOST__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SIP_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__SIP_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SIP_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # SIP over WebSocket. Asterisk serves the WSS transport on 8089; nginx
    # terminates TLS on 443 so no extra inbound port is needed.
    location /ws {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # PBX admin API, called server-to-server by the CloudTel API.
    location /pbx/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = / {
        default_type text/plain;
        return 200 "CloudTel telephony\n";
    }
}
