; CloudTel production dialplan.
;
; Softphone endpoints use context cloudtel-internal. Internal calls and
; voicemail are handed to the Stasis application, which owns call control and
; emits lifecycle events to the CloudTel API. Outbound trunk calls use the 9
; prefix and are enabled only when a trunk is configured.

[general]
static = yes
writeprotect = no

[globals]
STASIS_APP = cloudtel

[cloudtel-internal]
exten => _1XXX,1,NoOp(CloudTel internal call to ${EXTEN})
 same => n,Stasis(${STASIS_APP},internal,${EXTEN})
 same => n,Hangup()

exten => _9.,1,NoOp(CloudTel outbound call to ${EXTEN:1})
 same => n,Stasis(${STASIS_APP},outbound,${EXTEN:1})
 same => n,Hangup()

exten => _*97,1,NoOp(CloudTel voicemail for ${CALLERID(num)})
 same => n,Stasis(${STASIS_APP},voicemail,${CALLERID(num)})
 same => n,Hangup()

exten => _X.,1,NoOp(CloudTel unmapped call to ${EXTEN})
 same => n,Hangup()

[cloudtel-outbound]
exten => _X.,1,NoOp(CloudTel trunk call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@trunk,60)
 same => n,Hangup()
