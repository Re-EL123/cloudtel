; CloudTel Asterisk HTTP server.
;
; ARI (server-side) listens on loopback. The PJSIP WSS transport is served by
; this same HTTP server using its TLS listener on 8089 (Asterisk takes the
; certificate from http.conf, not pjsip.conf, for WebSocket transports).
[general]
enabled = yes
bindaddr = 127.0.0.1
bindport = 8088
tlsenable = yes
tlsbindaddr = 0.0.0.0:8089
tlscertfile = /etc/cloudtel-certs/fullchain.pem
tlsprivatekey = /etc/cloudtel-certs/privkey.pem
