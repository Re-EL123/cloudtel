; CloudTel production PJSIP configuration.
; Placeholders __SIP_HOST__ and __PUBLIC_IP__ are filled by deploy.sh.
;
; Generated extension includes live in pjsip.d/cloudtel.conf and are written by
; the CloudTel PBX admin service (telephony/pbx-admin).

[global]
type = global
endpoint_identifier_order = username,ip

; ---- WebRTC transport (WSS on 8089) ----
[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0:8089
cert_file = /etc/cloudtel-certs/fullchain.pem
priv_key_file = /etc/cloudtel-certs/privkey.pem
allow_reload = yes
external_media_address = __PUBLIC_IP__
external_signaling_address = __PUBLIC_IP__
local_net = 10.0.0.0/8
local_net = 172.16.0.0/12

; ---- Template applied to every softphone endpoint ----
[webrtc-endpoint](!)
type = endpoint
context = cloudtel-internal
disallow = all
allow = opus,ulaw
webrtc = yes
dtls_auto_generate_cert = yes
dtls_setup = actpass
media_encryption = dtls
media_encryption_optimistic = no
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
ice_support = yes
use_avpf = yes
media_use_received_transport = yes
timers = yes
dtmf_mode = rfc4733
allow_subscribe = yes
sub_min_expiry = 30

[aor-template](!)
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30
maximum_expiration = 3600

[auth-template](!)
type = auth
auth_type = userpass

#include pjsip.d/*.conf
